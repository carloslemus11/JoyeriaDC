# Joyería DC — configuración de Netlify
# Sitio estático, sin build. Se publica la raíz del repo tal cual.

[build]
  publish = "."
  command = ""

# Función programada: consulta Supabase cada 2 días para que el plan Free no lo pause por
# inactividad. El archivo vive en netlify/functions/keepalive-supabase.mjs.
[functions]
  directory = "netlify/functions"

# El sitio sirve https://<sitio>/admin/ desde admin/index.html automáticamente.

# Edge Function: agrega <meta name="dc-pais"> con el país aproximado del visitante
# (lo lee assets/interacciones.js para el registro de visitas). El archivo vive en
# netlify/edge-functions/geo-pais.js — hay que incluir esa carpeta al desplegar.
[[edge_functions]]
  path = "/"
  function = "geo-pais"

[[edge_functions]]
  path = "/index.html"
  function = "geo-pais"

# Archivos internos que NO deben ser públicos. Netlify publica la raíz del repo
# (publish = "."), así que sin estas reglas se podían descargar CLAUDE.md, el esquema y las
# políticas de la base, los specs y las fotos originales (24 MB). Responden 404.
[[redirects]]
  from = "/CLAUDE.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/README.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/revision-final.md"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/docs/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/supabase/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/netlify/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/IMAGENES%20JOYAS/*"
  to = "/404.html"
  status = 404
  force = true

[[redirects]]
  from = "/IMAGENES JOYAS/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), camera=(), microphone=()"

# El panel no debe indexarse
[[headers]]
  for = "/admin/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Caché de imágenes y de la librería propia. Antes todo se revalidaba en cada visita
# (max-age=0), incluso las fotos de las piezas. Se deja SIN caché largo el HTML, el CSS y el JS
# del sitio para que los cambios se vean al instante tras cada despliegue.
# - vendor/: archivo con versión en el nombre → nunca cambia → 1 año.
# - piezas/ y hero: 7 días (las fotos nuevas del panel usan nombres únicos en Storage).
[[headers]]
  for = "/assets/vendor/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/piezas/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/hero-joya.jpeg"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/assets/og-image.jpg"
  [headers.values]
    Cache-Control = "public, max-age=604800"
