<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Joyería DC · Panel</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,450;0,9..144,600;1,9..144,400&family=Manrope:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/styles.css">
<link rel="stylesheet" href="admin.css">
<script src="../assets/config.js"></script>
</head>
<body class="silk admin-body">

  <!-- Cargando -->
  <section id="loadingView" class="admin-shell"><div class="admin-card"><p class="admin-mono">Cargando…</p></div></section>

  <!-- Login -->
  <section id="loginView" class="admin-shell" hidden>
    <div class="admin-card">
      <p class="admin-eyebrow">Joyería DC</p>
      <h1 class="admin-title">Panel de administración</h1>
      <form id="loginForm" class="admin-form" autocomplete="on">
        <label class="admin-field"><span>Correo</span>
          <input type="email" id="email" name="email" required autocomplete="username"></label>
        <label class="admin-field"><span>Contraseña</span>
          <input type="password" id="password" name="password" required autocomplete="current-password"></label>
        <button type="submit" id="loginBtn" class="btn btn-fill">Entrar</button>
        <p id="loginError" class="admin-error" role="alert" hidden></p>
      </form>
    </div>
  </section>

  <!-- Panel -->
  <div id="panelView" hidden>
    <header class="admin-topbar">
      <div class="admin-brand">Joyería DC · Panel</div>
      <nav class="admin-nav">
        <button class="admin-tab is-active" data-tab="piezas">Piezas</button>
        <button class="admin-tab" data-tab="categorias">Categorías</button>
        <button class="admin-tab" data-tab="sugerencias">Sugerencias</button>
        <button class="admin-tab" data-tab="cotizaciones">Cotizaciones</button>
        <button class="admin-tab" data-tab="textos">Textos</button>
      </nav>
      <div class="admin-user">
        <span id="whoami" class="admin-mono"></span>
        <button id="logoutBtn" class="btn btn-ghost btn-sm">Salir</button>
      </div>
    </header>

    <main class="admin-main">
      <div id="globalMsg" class="admin-toast" hidden></div>

      <section id="tab-piezas" class="admin-tabpane">
        <div class="admin-pane-head">
          <h2>Piezas</h2>
          <div class="admin-pane-actions">
            <button id="importFotosBtn" class="btn btn-ghost btn-sm" hidden>Importar fotos iniciales</button>
            <button id="nuevaPiezaBtn" class="btn btn-fill btn-sm">Nueva pieza</button>
          </div>
        </div>
        <div id="piezasList" class="admin-list"></div>
      </section>

      <section id="tab-categorias" class="admin-tabpane" hidden>
        <div class="admin-pane-head">
          <h2>Categorías</h2>
          <button id="nuevaCatBtn" class="btn btn-fill btn-sm">Nueva categoría</button>
        </div>
        <div id="catList" class="admin-list"></div>
      </section>

      <section id="tab-sugerencias" class="admin-tabpane" hidden>
        <div class="admin-pane-head"><h2>Reseñas y sugerencias</h2></div>
        <div id="resumenResenas" class="admin-resumen">
          <div><strong id="resenasProm">—</strong><span>promedio</span></div>
          <div><strong id="resenasTotal">—</strong><span>calificaciones</span></div>
        </div>
        <h3 class="admin-sub">Sugerencias recibidas</h3>
        <div id="sugList" class="admin-list"></div>
      </section>

      <section id="tab-cotizaciones" class="admin-tabpane" hidden>
        <div class="admin-pane-head"><h2>Cotizaciones</h2></div>
        <div id="cotizResumen" class="admin-resumen">
          <div><strong id="cotizTotal">—</strong><span>clics en total</span></div>
          <div><strong id="cotiz30">—</strong><span>últimos 30 días</span></div>
        </div>
        <h3 class="admin-sub">Piezas / secciones más cotizadas</h3>
        <div id="cotizRanking" class="admin-list"></div>
        <h3 class="admin-sub">Últimos clics</h3>
        <div id="cotizLog" class="admin-list"></div>
      </section>

      <section id="tab-textos" class="admin-tabpane" hidden>
        <div class="admin-pane-head">
          <h2>Textos del sitio</h2>
          <button id="guardarTextosBtn" class="btn btn-fill btn-sm">Guardar cambios</button>
        </div>
        <form id="textosForm" class="admin-textos"></form>
      </section>
    </main>
  </div>

  <!-- Modal genérico -->
  <div id="modal" class="admin-modal" hidden>
    <div class="admin-modal-box">
      <div class="admin-modal-head">
        <h3 id="modalTitle">—</h3>
        <button id="modalClose" class="admin-x" aria-label="Cerrar">×</button>
      </div>
      <form id="modalForm" class="admin-form"></form>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
